# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@oml/review-gate"
  version: 1.0.0
  title: Review Gate
  description: The Review Gate ontologies.

# source folders
sources:
  - src

# oml server settings
# By default the server binds a free port chosen by the OS (the actual port is
# reported by 'oml list'), so multiple workspaces never collide. Uncomment to
# pin a fixed port instead, but make sure no other workspace uses the same one.
# server:
#   port: 8080

# Default CLI arguments per command, injected before your own (so you can override them on the
# command line). Works for any oml command; key by command name.
defaults:
  export: -o build/owl
  reason: -o build/owl
  render: -m src/model/md -b build/web -c src/model/oml/hongyan.github.io/review-gate/model/bundle.oml
