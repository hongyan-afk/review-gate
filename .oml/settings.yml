# oml-code settings
oml-code:
  schemaVersion: 1

# project npm settings
project:
  name: "@oml/review-gate"
  version: 1.0.0
  title: Review Gate
  description: The Review Gate ontologies.

# source folders
sources:
  - src

# Default CLI arguments per command, injected before your own (so you can override them on the
# command line). Works for any oml command; key by command name.
defaults:
  export: -o build/owl
  reason: -o build/owl
